<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PZT Rankingi</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#13284A">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="landing">
    <img class="logo" src="znak.svg" alt="" width="96" height="96">
    <h1>PZT Rankingi</h1>
    <p class="tagline">Offline aplikacja na Androida z rankingami tenisowymi PZT.<br>Offline Android app for Polish Tennis Association rankings.</p>
    <div class="choices">
      <a href="dokumentacja-pl.html"><span class="flag">🇵🇱</span>Dokumentacja po polsku</a>
      <a href="documentation-en.html"><span class="flag">🇬🇧</span>Documentation in English</a>
    </div>
    <div class="download-card" style="max-width:420px">
      <div class="info">
        <div class="version-label">Najnowsza wersja / Latest version</div>
        <div class="version-value" id="version">—</div>
        <div class="version-date" id="versionDate"></div>
      </div>
      <a class="btn-download" id="downloadBtn" href="pzt-rankingi-latest.apk">⬇ Pobierz APK</a>
    </div>
  </div>
  <script>
    fetch("version.json").then(r => r.json()).then(v => {
      document.getElementById("version").textContent = "v" + v.version;
      document.getElementById("versionDate").textContent = v.date ? "Build: " + v.date : "";
    }).catch(() => {});
  </script>
</body>
</html>
